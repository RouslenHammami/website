<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Test Website</title>

    <style>
        body {

            font-family: Arial, sans-serif;
            background: #f4f4f4;

<body>

    <div class="card">
